name: CI

# A caller, never a container. Every check lives in tools/validate.sh, so the
# same six checks run on the machine this was written on, before the push, with
# `oss check uncropped`. They used to be six inline steps here, which meant the
# only way to run them was to push and wait.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Validate
        run: tools/validate.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uncropped-unpacked
          path: uncropped-*.zip
