<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1400px; height:560px; overflow:hidden;
    background:#0e1013;
    background-image:
      linear-gradient(#ffffff0a 1px, transparent 1px),
      linear-gradient(90deg, #ffffff0a 1px, transparent 1px);
    background-size:28px 28px, 28px 28px;
    color:#f0eee9;
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display:flex; align-items:center; gap:80px; padding:0 92px;
  }
  .left { flex:0 0 auto; display:flex; flex-direction:column; gap:22px; }
  .brand { display:flex; align-items:center; gap:20px; }
  .mark { width:88px; height:88px; }
  h1 { font-size:56px; letter-spacing:.2em; font-weight:600; text-indent:.2em; }
  .rule { width:220px; height:2px; background:#ff6a42; }
  .tag { font-size:17px; line-height:1.6; color:#a7adb8; max-width:430px; }
  b { color:#ff6a42; font-weight:600; }
  .specs { display:flex; gap:34px; font-size:12px; color:#6f767f; letter-spacing:.06em; }
  .specs span { display:block; }
  .specs strong { display:block; color:#e6e3de; font-size:15px; letter-spacing:.02em; margin-top:4px; }
  .right { flex:1 1 auto; display:flex; justify-content:center; }
  svg.dia { width:100%; height:400px; }
  .lbl { font:11px ui-monospace, Menlo, monospace; fill:#8b929c; letter-spacing:.08em; }
  .lbl-a { fill:#ff6a42; }
</style></head>
<body>
  <div class="left">
    <div class="brand">
      <svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <rect width="128" height="128" rx="28" fill="#1c1f26"/>
        <clipPath id="cm"><rect width="128" height="128" rx="28"/></clipPath>
        <g clip-path="url(#cm)">
          <rect x="36" y="-14" width="56" height="156" rx="7" fill="#f5f3ee"/>
          <g fill="#cbc6bb">
            <rect x="46" y="27" width="36" height="5" rx="2.5"/>
            <rect x="46" y="39" width="36" height="5" rx="2.5"/>
            <rect x="46" y="51" width="24" height="5" rx="2.5"/>
            <rect x="46" y="77" width="36" height="5" rx="2.5"/>
            <rect x="46" y="89" width="36" height="5" rx="2.5"/>
            <rect x="46" y="101" width="24" height="5" rx="2.5"/>
            <rect x="46" y="113" width="30" height="5" rx="2.5"/>
          </g>
          <rect x="23" y="18" width="82" height="45" rx="9" fill="none" stroke="#ff6a42" stroke-width="7"/>
        </g>
      </svg>
      <h1>UNCROPPED</h1>
    </div>
    <div class="rule"></div>
    <p class="tag">Your browser has a button called <b>Capture full size screenshot</b>. This is that button, but it means it.</p>
    <div class="specs">
      <span>SCROLL AXES<strong>both</strong></span>
      <span>INNER SCROLLERS<strong>yes</strong></span>
      <span>DEPENDENCIES<strong>none</strong></span>
    </div>
  </div>

  <div class="right">
    <svg class="dia" viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg">
      <!-- the full document -->
      <rect x="150" y="10" width="230" height="380" rx="8" fill="#f5f3ee"/>
      <g fill="#d5d0c5">
        <rect x="172" y="40" width="186" height="9" rx="4.5"/>
        <rect x="172" y="60" width="186" height="9" rx="4.5"/>
        <rect x="172" y="80" width="120" height="9" rx="4.5"/>
        <rect x="172" y="128" width="186" height="9" rx="4.5"/>
        <rect x="172" y="148" width="186" height="9" rx="4.5"/>
        <rect x="172" y="168" width="140" height="9" rx="4.5"/>
        <rect x="172" y="216" width="186" height="9" rx="4.5"/>
        <rect x="172" y="236" width="160" height="9" rx="4.5"/>
        <rect x="172" y="284" width="186" height="9" rx="4.5"/>
        <rect x="172" y="304" width="186" height="9" rx="4.5"/>
        <rect x="172" y="324" width="110" height="9" rx="4.5"/>
      </g>
      <!-- what the browser thinks the page is -->
      <rect x="132" y="26" width="266" height="96" rx="10" fill="none" stroke="#ff6a42" stroke-width="4"/>
      <text class="lbl lbl-a" x="132" y="18">WHAT CHROME CAPTURES</text>
      <!-- full height dimension -->
      <g stroke="#8b929c" stroke-width="1.5" fill="none">
        <path d="M96 10 h22 M96 390 h22 M107 10 v380"/>
      </g>
      <path d="M107 10 l-5 10 h10 z M107 390 l-5 -10 h10 z" fill="#8b929c"/>
      <text class="lbl" x="88" y="196" text-anchor="end">FULL SIZE</text>
      <text class="lbl" x="88" y="212" text-anchor="end">1440 x 11204</text>
      <text class="lbl" x="410" y="386">UNCROPPED.PNG</text>
    </svg>
  </div>
</body></html>
